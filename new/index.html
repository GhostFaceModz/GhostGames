*{margin:0;padding:0;box-sizing:border-box}

/* §1 core: fixed 1172x657 design canvas scaled by one transform */
.stage{position:fixed;inset:0;overflow:hidden;background:#020204}

.stack{position:absolute;inset:0;z-index:300}

.navmenu{display:contents}
.burger{display:none}

.links{position:absolute;left:156px;top:0;height:62px;transform-origin:0 50%;display:flex;align-items:center;gap:24px}

/* §2 PIXEL CONTRACT A — badge */

 background:linear-gradient(to top, rgba(190,225,255,.175) 0px, rgba(190,225,255,.128) 2px, rgba(190,225,255,.075) 4px, rgba(190,225,255,.026) 6px, rgba(255,255,255,.012) 9px, rgba(255,255,255,.012) 100%);

 background:linear-gradient(to top, #46afc8 0px, #35abc7 2px, #0b859d 4px, #026c84 6px, #004e66 8px, #053f58 10px, #012c3d 12px, #031a2a 14px, #061125 16px, #090f25 19px, #090c1c 23px, #060d16 29px);
 box-shadow:inset 1px 0 0 rgba(150,220,250,.40), inset -1px 0 0 rgba(150,220,250,.52), 0 0 6px rgba(60,190,230,.20), 0 3px 8px -5px rgba(90,220,255,.6)}
.badge i svg{width:14px;height:16px;position:relative;top:-1px;left:0px}
.badge b{position:absolute;left:45px;transform-origin:0 50%;top:0;height:39px;display:flex;align-items:center;font-size:13px;font-weight:400;color:rgba(255,255,255,.94);white-space:nowrap;padding-top:1.5px}

/* §3 PIXEL CONTRACT B — glow button */
.btn{display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;

 box-shadow: inset 0 3px 3px -2px rgba(180,228,255,.10), inset 1px 0 0 rgba(255,255,255,.09), inset -1px 0 0 rgba(255,255,255,.09), var(--hair,0 1px 0 rgba(152,218,234,.38)), 1px 0 0 rgba(152,218,234,.17), -1px 0 0 rgba(152,218,234,.17), 0 0 8px rgba(60,190,235,.10), 0 2px 5px -3px rgba(90,220,255,.45);
 transition:transform .25s,box-shadow .25s,filter .25s}
.btn::before{content:"";position:absolute;left:22%;right:38%;top:0.8px;height:1.9px;z-index:1;filter:blur(.55px);background:linear-gradient(90deg,rgba(120,225,255,0) 0%,rgba(120,225,255,.58) 34%,rgba(160,240,255,.74) 50%,rgba(120,225,255,.58) 66%,rgba(120,225,255,0) 100%)}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
 background:linear-gradient(90deg,rgba(200,245,255,.70),rgba(200,245,255,0) 13px), linear-gradient(270deg,rgba(200,245,255,.70),rgba(200,245,255,0) 13px);
 -webkit-mask:linear-gradient(to top,#000 0,#000 6px,rgba(0,0,0,.40) 12px,rgba(0,0,0,.15) 18px,rgba(0,0,0,.09) 24px,rgba(0,0,0,.02) 30px,rgba(0,0,0,.02) 100%);
 mask:linear-gradient(to top,#000 0,#000 6px,rgba(0,0,0,.40) 12px,rgba(0,0,0,.15) 18px,rgba(0,0,0,.09) 24px,rgba(0,0,0,.02) 30px,rgba(0,0,0,.02) 100%)}
.btn span{position:relative;z-index:2;display:block;line-height:1;text-shadow:0 1px 2px rgba(0,20,30,.5)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.12);box-shadow:inset 0 1px 0 rgba(200,245,255,.6),inset 1px 0 0 rgba(170,225,255,.35),inset -1px 0 0 rgba(170,225,255,.35),0 6px 22px rgba(20,180,225,.55)}
.nav .btn{position:absolute;left:530.7px;top:10.5px;width:125.5px;height:39.5px;border-radius:14px;font-size:14px;font-weight:500;letter-spacing:-.005em}

.cta2{position:absolute;left:526px;top:349px;width:121px;height:54.5px;--hair:0 0 0 transparent;border-radius:13px;font-size:17px;font-weight:500;letter-spacing:-.01em;z-index:300}

/* §5 hero type */
.h1{left:586px;transform:translateX(-50%);white-space:nowrap;line-height:1;font-family:Poppins;font-weight:900;font-size:54px;letter-spacing:-.004em;word-spacing:.175em;text-transform:uppercase;color:#fff;text-shadow:0 0 34px rgba(130,180,255,.22);z-index:300}

.card{position:absolute;left:586px;top:616px;width:130px;height:300px;margin:-150px 0 0 -65px;border-radius:12px;overflow:hidden;background:#0d1117;box-shadow:0 24px 46px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.5);backface-visibility:hidden;will-change:transform}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stack{pointer-events:none}.stack>*{pointer-events:auto}
button.card{border:0;padding:0;font:inherit;color:#fff;text-align:left;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
button.card:focus-visible{outline:2px solid rgba(120,225,255,.85);outline-offset:3px}

.card .vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 38%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
.card .cat{position:absolute;left:10px;top:12px;font-size:4.6px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.9)}
.card .chip{position:absolute;right:9px;top:9px;padding:2.6px 5.5px;border-radius:20px;background:rgba(255,255,255,.92);color:#0c0f16;font-size:4.2px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.card .ttl{position:absolute;left:10px;width:124px;white-space:normal}
.card .ico{position:absolute;font-size:15px;color:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}

.cv{position:absolute;left:0;right:0;padding:0 10px}
.fill{position:absolute;inset:0}
.ph{position:absolute;left:0;right:0;overflow:hidden;background:linear-gradient(155deg,#2b3b50,#131c28 60%,#1d1526)}
.phf{top:0;bottom:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dot{display:inline-block;width:4.5px;height:4.5px;background:#e5202f;margin-right:4px;transform:rotate(45deg) translateY(-1px)}
.dot.sq{transform:none;width:6.5px;height:4.5px;border-radius:1px}
.t-big{font-family:Poppins;font-weight:900;text-transform:uppercase;line-height:.96;letter-spacing:-.015em;white-space:nowrap;transform:scaleX(.875);transform-origin:left center}
.t-serif{font-family:"Playfair Display",serif;line-height:1.02;letter-spacing:.01em;white-space:nowrap}

.dots{position:absolute;left:27px;top:16px;display:flex;gap:2.6px}
.dots i{width:7.6px;height:7.6px;border-radius:50%}
.dots i:nth-child(1){background:#ee5c62}.dots i:nth-child(2){background:#f6b719}.dots i:nth-child(3){background:#12c02f}
.omni{position:absolute;left:246px;top:7px;width:336px;height:26px;border-radius:5px;background:rgba(9,13,26,.93);box-shadow:inset 0 0 0 1px rgba(255,255,255,.045);display:flex;align-items:center;justify-content:center;gap:6px}
.omni svg{width:9px;height:9px;opacity:.72}
.omni span{font-size:9.5px;color:rgba(255,255,255,.72);letter-spacing:.005em}
.tools{position:absolute;right:27px;top:14px;display:flex;align-items:center;gap:4px;opacity:.9}
.tools svg{width:11px;height:12px}
.page{position:absolute;left:7px;right:6px;top:42px;bottom:0;background:#fff;color:#111;overflow:hidden;border-radius:10px 10px 0 0}

.ann span{font-size:5px;letter-spacing:.06em;color:#cfcfcf}
.ann u{position:absolute;font-size:6px;color:#9a9a9a;text-decoration:none}
.ann u.l{left:20px}.ann u.r{right:20px}
.shoplogo{position:absolute;left:50%;transform:translateX(-50%);top:24px;text-align:center}
.shoplogo em{font-family:"Playfair Display",serif;font-style:normal;font-weight:600;font-size:15px;letter-spacing:.14em;line-height:1;display:block}
.shoplogo i{font-style:normal;font-size:5px;letter-spacing:.3em;color:#3a3a3a;margin-top:3px;display:block}

.shopicons svg{width:7px;height:7px}
.pagebody{position:absolute;left:0;right:0;top:62px;bottom:0;background:#fff;overflow:hidden}
.pghero{position:relative;margin:0 26px;height:158px;border-radius:7px;overflow:hidden;background:linear-gradient(120deg,#e8dcd4,#cbb6a8)}
.pghero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pghero .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(28,20,16,.62) 0%,rgba(28,20,16,.30) 46%,rgba(28,20,16,0) 72%)}
.pghero .copy{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:#fff}
.pghero .copy u{font-size:4.6px;letter-spacing:.26em;text-transform:uppercase;opacity:.9;display:block;text-decoration:none}
.pghero .copy em{font-family:"Playfair Display",serif;font-style:normal;font-weight:600;font-size:15px;line-height:1.12;margin-top:6px;display:block}
.pghero .copy i{display:inline-block;margin-top:10px;padding:5px 13px;border-radius:20px;background:#fff;color:#17181c;font-size:5.2px;font-weight:600;letter-spacing:.06em;font-style:normal}
.pgsec{display:flex;align-items:baseline;justify-content:space-between;margin:16px 26px 9px}
.pgsec b{font-family:"Playfair Display",serif;font-weight:600;font-size:9px;color:#17181c}
.pgsec u{font-size:4.6px;letter-spacing:.14em;color:#8a8a8a;text-transform:uppercase;text-decoration:none}
.pggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0 26px}
.pgcard .ph{position:relative;height:0;padding-bottom:104%;border-radius:6px;overflow:hidden;background:linear-gradient(150deg,#efe7e1,#ddcfc6)}
.pgcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pgcard .tag{position:absolute;left:6px;top:6px;padding:2px 5px;border-radius:3px;background:#17181c;color:#fff;font-size:3.8px;font-weight:600;letter-spacing:.1em}

.pgcard i{display:block;font-style:normal;margin-top:2px;font-size:4.6px;color:#8a8a8a}

.pgcard s span{font-weight:400;color:#a08f86;text-decoration:line-through;margin-left:4px;font-size:4.6px}
.pgstrip{display:flex;justify-content:space-between;margin:16px 26px 0;padding:9px 0;border-top:1px solid #eee6e0;border-bottom:1px solid #eee6e0}

.page{background:#0b0e15;color:#eef2f7}
.ann{background:#05070b}
.gglogo{position:absolute;left:26px;top:22px;display:flex;align-items:center;gap:5px}
.gglogo i{font-size:10px;color:#5fe3ff;filter:drop-shadow(0 0 4px rgba(60,224,255,.6))}
.gglogo em{font-style:normal;font-weight:900;font-size:10px;letter-spacing:.02em}.gglogo em span{color:#5fe3ff}
.ggnav{position:absolute;right:26px;top:24px;display:flex;gap:10px;font-size:5.4px;color:#9aa3b2}
.ggnav b{color:#fff;font-weight:600}
.pagebody{background:#0b0e15}
.pghero{cursor:pointer;background:linear-gradient(120deg,var(--c1,#123),var(--c2,#012))}
.pghero .scrim{background:linear-gradient(90deg,rgba(5,7,12,.86) 0%,rgba(5,7,12,.45) 48%,rgba(5,7,12,0) 75%)}

/* §10 shared ≤1080 burger menu (same DOM nodes re-laid in panel) */
@media (max-width:1080px){
.burger{display:grid;place-content:center;gap:4px;position:absolute;right:12px;top:11px;width:42px;height:42px;padding:0;border:0;border-radius:14px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}

.burger:focus-visible{outline:2px solid rgba(120,225,255,.7);outline-offset:2px}

.nav.open .burger span:nth-child(2){opacity:0}
.nav.open .burger span:nth-child(3){transform:translateY(-5.6px) rotate(-45deg)}
.navmenu{display:block;position:absolute;left:0;right:0;top:74px;padding:12px;border-radius:22px;border:1px solid rgba(255,255,255,.10);background:linear-gradient(180deg,rgba(11,15,22,.985),rgba(7,10,16,.99));-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 26px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .24s ease,transform .28s cubic-bezier(.4,0,.2,1),visibility .28s}
.nav.open .navmenu{opacity:1;visibility:visible;transform:none}
.links{position:static;display:grid;grid-template-columns:1fr 1fr;align-items:stretch;height:auto;gap:2px;transform:none!important}
.links a.xc{display:block}
.links a.on{background:rgba(95,227,255,.10);color:#fff}
.navmenu{max-height:calc(100vh - 90px);overflow:auto}
.links a{font-size:15px;padding:11px 14px;border-radius:12px;color:rgba(255,255,255,.9);transition:background .2s,color .2s}
.nav .btn{position:static;width:100%;height:46px;margin-top:10px;font-size:15px}

   W=DW_MIN+(vw-TAB_MIN)*(CW-DW_MIN)/(TAB_MAX-TAB_MIN);
   if(vh>vw*1.15)W=Math.min(W,900);
   ramp=Math.min(1,(TAB_MAX-vw)/120);
  }else mode='desk';
  tboost=1+0.14*ramp;
  /* k = min(vw/W, vh/560): 560 (not 657) on purpose — width fills, mock bleeds off bottom */
  k=Math.min(vw/W,vh/560);
  var fill=Math.max(0,vh/k-657),ss=0,rs=1,st=0;
  if(mode==='tab'&&fill>0){
   /* 3-way split of spare height: showcase shift / ring scale / text-stack shift */
   ss=Math.min(fill*0.55,420)*ramp;
   rs=1+Math.min(fill/1100,0.75)*ramp;
   var slack=219.5-125*rs+ss;
   st=Math.max(0,slack/2-28)*ramp;
   fill-=ss;
  }
  s.setProperty('--k',k);s.setProperty('--fill',fill+'px');
  s.setProperty('--stshift',st+'px');s.setProperty('--sshift',ss+'px');s.setProperty('--rs',rs);
 }
 if(mode!=='phone'&&mode!=='tab')closeMenu();
 layout();
}

/* §11 type fitter */
var mctx=document.createElement('canvas').getContext('2d');
function fontOf(el){var cs=getComputedStyle(el);return{css:cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily,size:parseFloat(cs.fontSize)}}
function inkWidth(el){return el.getBoundingClientRect().width/(mode==='phone'?1:k)}
function capRatio(el){var f=fontOf(el);mctx.font=f.css.replace(/[\d.]+px/,'100px');var m=mctx.measureText('H');return(m.actualBoundingBoxAscent||70)/100}
function fitBox(el,tw,tc,pre){
 pre=pre||'';el.style.transform=pre;
 el.style.fontSize=(tc/capRatio(el))+'px';
 el.style.transform=pre+' scaleX('+(tw/inkWidth(el))+')';
}
function baseline(el,y){
 var f=fontOf(el);mctx.font=f.css;var m=mctx.measureText('H');
 var A=m.fontBoundingBoxAscent||f.size*.8,D=m.fontBoundingBoxDescent||f.size*.2;
 el.style.top=(y-((f.size-(A+D))/2+A))+'px';
}
function centreLabel(btn,el,capPx){
 el.style.top='';
 var p=document.createElement('i');p.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
 el.appendChild(p);
 var base=(p.getBoundingClientRect().top-btn.getBoundingClientRect().top)/k;
 el.removeChild(p);
 el.style.top=(btn.offsetHeight/2-(base-capPx/2)+1.1)+'px'; /* BIAS 1.1 */
}
var FIT=['h1a','h1b','sub1','sub2','badgeTxt','wmName','ctaLabel','vpLabel'];
function layout(){
 var links=$('links');
 if(mode==='phone'){
  FIT.forEach(function(id){var e=$(id).style;e.fontSize='';e.top='';e.transform=''});
  links.style.fontSize='';links.style.transform='';
  Array.prototype.forEach.call(links.children,function(a){a.style.fontSize=''});
  placeCards();return;
 }
 var T=mode==='tab'?tboost:1;
 fitBox($('h1a'),563.5*T,37.2*T,'translateX(-50%)');baseline($('h1a'),204.5);
 fitBox($('h1b'),197.5*T,37.2*T,'translateX(-50%)');baseline($('h1b'),258.5);
 fitBox($('sub1'),389*T,8.4*T,'translateX(-50%)');baseline($('sub1'),300.5);
 fitBox($('sub2'),311*T,8.4*T,'translateX(-50%)');baseline($('sub2'),316.5);
 fitBox($('badgeTxt'),184*T,9.4*T,'translate(2px,-1px)');
 fitBox($('wmName'),51*T,11.4*T);baseline($('wmName'),38.5);
 var cl=$('ctaLabel'),vl=$('vpLabel');
 fitBox(cl,87*T,8.9*T);centreLabel(cl.parentNode,cl,8.9*T);
 fitBox(vl,76*T,9.5*T);centreLabel(vl.parentNode,vl,9.5*T);
 links.style.transform='';
 if(mode==='tab'){Array.prototype.forEach.call(links.children,function(a){a.style.fontSize=''})}
 else{
  var fs=7.9/capRatio(links.children[0]);
  Array.prototype.forEach.call(links.children,function(a){a.style.fontSize=fs+'px'});
  links.style.transform='scaleX('+(317/(links.getBoundingClientRect().width/k))+')';
 }
 placeCards();
}

/* menu */
var nav=$('nav'),burger=$('burger'),menu=$('navmenu');
function closeMenu(){nav.classList.remove('open');burger.setAttribute('aria-expanded','false')}
burger.addEventListener('click',function(e){e.stopPropagation();var o=nav.classList.toggle('open');burger.setAttribute('aria-expanded',o?'true':'false')});
document.addEventListener('click',function(e){if(nav.classList.contains('open')&&!nav.contains(e.target))closeMenu()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&nav.classList.contains('open')){closeMenu();burger.focus()}});
menu.addEventListener('click',function(e){if(e.target.closest('a'))closeMenu()});

window.addEventListener('resize',resize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
setTimeout(layout,400);setTimeout(layout,1400);
requestAnimationFrame(tick);

/* §12 entrance timeline */
(function(){
 var html=document.documentElement;
 function settle(){if(document.getAnimations)document.getAnimations().forEach(function(a){if(a.id&&a.id.indexOf('intro:')===0)a.cancel()});html.classList.remove('intro')}
 if(!html.classList.contains('intro')||RM||!Element.prototype.animate){settle();return}
 var D=innerWidth<=700?.66:1,EXPO='cubic-bezier(.16,1,.3,1)',SOFT='cubic-bezier(.22,.61,.36,1)',n=0,lastA=null,lastEnd=0;
 function Y(px){return '0 '+(px*D)+'px'}
 function play(el,from,dur,delay,ease){
  if(!el)return;var to={opacity:1};
  if('translate' in from)to.translate='0 0';if('scale' in from)to.scale='1';if('clipPath' in from)to.clipPath='inset(-30% 0 -30% 0)';
  var a=el.animate([from,to],{duration:dur,delay:delay,easing:ease,fill:'both'});a.id='intro:'+(n++);
  if(dur+delay>lastEnd){lastEnd=dur+delay;lastA=a}
 }
 var q=function(s){return document.querySelector(s)};
 play(q('.nav'),{opacity:0,translate:Y(-9)},620,60,EXPO);
 play(q('.mark'),{opacity:0,translate:Y(6)},520,150,SOFT);
 play(q('.wm'),{opacity:0,translate:Y(6)},520,185,SOFT);
 document.querySelectorAll('.links a').forEach(function(a,i){play(a,{opacity:0,translate:Y(6)},460,215+i*45,SOFT)});
 play(q('.burger'),{opacity:0,translate:Y(6)},460,300,SOFT);
 play(q('.nav .btn'),{opacity:0,translate:Y(6)},500,400,SOFT);
 play(q('.badge'),{opacity:0,translate:Y(11),scale:.985},560,270,EXPO);
 var clip='inset(100% 0 -30% 0)';
 play($('h1a'),{opacity:0,translate:Y(15),clipPath:clip},900,380,EXPO);
 play($('h1b'),{opacity:0,translate:Y(15),clipPath:clip},900,470,EXPO);
 play($('sub1'),{opacity:0,translate:Y(10)},620,690,EXPO);
 play($('sub2'),{opacity:0,translate:Y(10)},620,745,EXPO);
 play(q('.cta2'),{opacity:0,translate:Y(13),scale:.985},620,830,EXPO);
 play(q('.ring'),{opacity:0,translate:Y(18),scale:.99},950,700,EXPO);
 play(q('.wa'),{opacity:0,scale:.88},500,1260,EXPO);
 if(lastA)lastA.finished.then(settle).catch(settle);else settle();
})();
})();
</script>
